<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeetCodeSync Settings</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="settings-container">
    <!-- Header -->
    <header class="settings-header">
      <button id="backBtn" class="back-btn" title="Back to Dashboard">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        <span>Back</span>
      </button>
      <div class="header-titles">
        <h2>Settings</h2>
        <span class="header-subtitle">Configuration & Preferences</span>
      </div>
    </header>

    <form id="settingsForm" class="settings-form">
      <!-- Card 1: GitHub Authentication -->
      <div class="settings-card">
        <div class="card-header">
          <svg class="card-icon" width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/>
          </svg>
          <span class="card-title">GITHUB AUTHENTICATION</span>
        </div>

        <div class="form-group">
          <div class="label-row">
            <label for="githubToken">Personal Access Token (PAT)</label>
            <a href="https://github.com/settings/tokens?type=beta" target="_blank" class="token-link">Generate Token ↗</a>
          </div>
          <div class="input-with-button">
            <input type="password" id="githubToken" placeholder="github_pat_..." autocomplete="off">
            <button type="button" id="toggleTokenVisibility" class="btn-input" title="Toggle visibility">
              <svg id="eyeIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <div class="scope-badge">
            <span class="scope-tag">Contents: read/write</span>
            <span class="scope-tag">Metadata: read-only</span>
          </div>
        </div>
      </div>

      <!-- Card 2: Target Repository -->
      <div class="settings-card">
        <div class="card-header">
          <svg class="card-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
          <span class="card-title">TARGET REPOSITORY</span>
        </div>

        <div class="form-group">
          <label for="owner">Owner / Organization</label>
          <div class="input-prefix-wrapper">
            <span class="input-prefix">@</span>
            <input type="text" id="owner" placeholder="github-username">
          </div>
        </div>

        <div class="form-group">
          <label for="repo">Repository Name</label>
          <input type="text" id="repo" placeholder="leetcode-solutions">
        </div>

        <div class="form-grid-2">
          <div class="form-group">
            <label for="branch">Target Branch</label>
            <input type="text" id="branch" placeholder="main" value="main">
          </div>
          <div class="form-group">
            <label for="targetDirectory">Target Directory</label>
            <input type="text" id="targetDirectory" placeholder="leetcode" value="leetcode">
          </div>
        </div>
        <span class="help-text">Leave directory empty to sync directly to repository root.</span>
      </div>

      <!-- Card 3: Synchronization Preferences -->
      <div class="settings-card">
        <div class="card-header">
          <svg class="card-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="21" x2="4" y2="14"></line>
            <line x1="4" y1="10" x2="4" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12" y2="3"></line>
            <line x1="20" y1="21" x2="20" y2="16"></line>
            <line x1="20" y1="12" x2="20" y2="3"></line>
            <line x1="1" y1="14" x2="7" y2="14"></line>
            <line x1="9" y1="8" x2="15" y2="8"></line>
            <line x1="17" y1="16" x2="23" y2="16"></line>
          </svg>
          <span class="card-title">SYNC PREFERENCES</span>
        </div>

        <div class="form-group">
          <label>Folder Naming Convention</label>
          <div class="radio-card-group">
            <label class="radio-card">
              <input type="radio" name="folderNaming" value="padded" checked>
              <div class="radio-content">
                <strong>0001 - Two Sum</strong>
                <span class="radio-desc">Padded number & title (Recommended)</span>
              </div>
            </label>
            <label class="radio-card">
              <input type="radio" name="folderNaming" value="plain">
              <div class="radio-content">
                <strong>Two Sum</strong>
                <span class="radio-desc">Problem title only</span>
              </div>
            </label>
          </div>
        </div>

        <div class="auto-sync-row">
          <div class="auto-sync-info">
            <strong>Auto Sync on Accepted</strong>
            <span>Automatically commit when solution passes</span>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" id="settingsAutoSync" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="form-actions">
        <button type="button" id="testSettingsBtn" class="btn btn-secondary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path>
          </svg>
          <span>Test Connection</span>
        </button>
        <button type="submit" id="saveBtn" class="btn btn-primary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span>Save Settings</span>
        </button>
      </div>

      <!-- Alert Box -->
      <div id="settingsAlert" class="alert-box" style="display: none;"></div>
    </form>
  </div>

  <script type="module" src="settings.js"></script>
</body>
</html>
